<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12203A">
<title>CA Tutor</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12203A;--ink2:#1B2D4F;--paper:#F2F5F8;--card:#fff;--line:#D9E0E8;--gold:#F5A524;--text:#16202E;--mute:#5E6B7C}
@media (prefers-color-scheme:dark){:root{--paper:#0D1524;--card:#16233A;--line:#2A3A55;--text:#E8EDF4;--mute:#9AA8BC}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--paper);color:var(--text);display:flex;flex-direction:column;font-size:16px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:19px;margin:0;font-weight:700}
h1 span{color:var(--gold)}
button{font:inherit;cursor:pointer}
#new{background:none;border:1px solid #ffffff44;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.seg{display:flex;background:var(--ink2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:#B9C6DB;padding:7px 0;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--gold);color:#12203A}
.row{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #ffffff33;background:none;color:#DCE5F3;border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
select{flex:none;background:var(--ink2);color:#fff;border:1px solid #ffffff33;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;max-width:60vw}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;padding:10px 13px;border-radius:14px;word-wrap:break-word;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.a p{margin:0 0 8px}.a p:last-child{margin:0}
.a ul,.a ol{margin:4px 0 8px;padding-left:20px}
.a h3,.a h4{margin:10px 0 4px;font-size:16px}
.a code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:14px}
.tw{overflow-x:auto;margin:6px 0}
.a table{border-collapse:collapse;font-size:14px;min-width:100%}
.a th,.a td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.a th{background:var(--paper)}
.err{align-self:center;color:#B3261E;font-size:14px;text-align:center}
.dots{color:var(--mute)}
#empty{margin:auto;text-align:center;max-width:340px;color:var(--mute)}
#empty h2{color:var(--text);font-size:20px;margin:0 0 6px}
.sug{display:block;width:100%;text-align:left;margin-top:8px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px}
form{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;max-height:140px;outline:none}
textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#send{background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:0 18px;font-weight:700}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <div class="top"><h1>CA <span>Tutor</span></h1><button id="new" type="button">New chat</button></div>
  <div class="seg" id="levels"></div>
  <div class="row"><select id="subject" aria-label="Subject"></select></div>
  <div class="row" id="modes"></div>
</header>
<main id="msgs" aria-live="polite"></main>
<form id="f">
  <textarea id="t" rows="1" placeholder="Ask your doubt"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const LEVELS={
  Foundation:["Principles and Practice of Accounting","Business Laws","Business Mathematics, LR and Statistics","Business Economics and BCK"],
  Inter:["Advanced Accounting","Corporate and Other Laws","Taxation","Cost and Management Accounting","Auditing and Ethics","Financial Management and Strategic Management"],
  Final:["Financial Reporting","Advanced Financial Management","Advanced Auditing","Corporate and Economic Laws","Strategic Cost and Performance Management","Direct Tax Laws and International Taxation","Indirect Tax Laws"]
};
const MODES={
  doubt:{l:"Doubt solver",ph:"Ask your doubt, e.g. Why is goodwill not amortised under Ind AS?",s:["Explain a concept I find confusing","Solve a numerical step by step"]},
  eval:{l:"Check my answer",ph:"Paste the question with its marks, then your answer",s:["Evaluate my answer like an ICAI examiner"]},
  practice:{l:"Practice",ph:"Chapter or topic, e.g. Depreciation, 5 MCQs",s:["Give me 5 MCQs on my subject","Give me one case study with answer later"]},
  notes:{l:"Summarise notes",ph:"Paste your notes or a chapter here",s:["Make flashcards from my notes"]},
  plan:{l:"Revision plan",ph:"Exam date, hours per day, weak topics",s:["Build me a 30-day revision plan"]}
};
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem("ca")||"null")||{level:"Inter",subject:"",mode:"doubt",msgs:[]};
const save=()=>{try{localStorage.setItem("ca",JSON.stringify(S))}catch(e){}};

function drawHeader(){
  $("levels").innerHTML=Object.keys(LEVELS).map(l=>`<button type="button" data-l="${l}" class="${l==S.level?"on":""}">${l}</button>`).join("");
  $("subject").innerHTML=`<option value="">All subjects</option>`+LEVELS[S.level].map(x=>`<option ${x==S.subject?"selected":""}>${x}</option>`).join("");
  $("modes").innerHTML=Object.entries(MODES).map(([k,v])=>`<button type="button" data-m="${k}" class="chip ${k==S.mode?"on":""}">${v.l}</button>`).join("");
  $("t").placeholder=MODES[S.mode].ph;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>")}
function md(src){
  const L=src.split("\n"),o=[];let i=0;
  while(i<L.length){
    const x=L[i].trim();
    if(!x){i++;continue}
    if(x[0]=="|"){const r=[];while(i<L.length&&L[i].trim()[0]=="|"){r.push(L[i].trim());i++}
      const cells=t=>t.replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim()));
      const rows=r.filter(t=>!/^\|[\s:|-]+\|?$/.test(t)).map(cells);
      o.push(`<div class="tw"><table>${rows.map((c,j)=>`<tr>${c.map(v=>j?`<td>${v}</td>`:`<th>${v}</th>`).join("")}</tr>`).join("")}</table></div>`);continue}
    if(/^#{1,4}\s/.test(x)){o.push(`<h3>${inl(x.replace(/^#+\s/,""))}</h3>`);i++;continue}
    if(/^([-*]|\d+[.)])\s/.test(x)){const ord=/^\d/.test(x),it=[];
      while(i<L.length&&/^([-*]|\d+[.)])\s/.test(L[i].trim())){it.push(`<li>${inl(L[i].trim().replace(/^([-*]|\d+[.)])\s/,""))}</li>`);i++}
      o.push(`<${ord?"ol":"ul"}>${it.join("")}</${ord?"ol":"ul"}>`);continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(\||#|[-*]\s|\d+[.)]\s)/.test(L[i].trim())){p.push(inl(L[i].trim()));i++}
    o.push(`<p>${p.join("<br>")}</p>`);
  }
  return o.join("");
}
function drawMsgs(){
  const box=$("msgs");
  if(!S.msgs.length){
    box.innerHTML=`<div id="empty"><h2>Hi, I'm your CA Tutor</h2><p>Pick your level and subject above, then ask anything. I'll explain step by step.</p>${MODES[S.mode].s.map(x=>`<button type="button" class="sug">${x}</button>`).join("")}</div>`;
    return;
  }
  box.innerHTML=S.msgs.map(m=>m.role=="user"?`<div class="m u">${esc(m.text)}</div>`:`<div class="m a">${md(m.text)}</div>`).join("");
  box.scrollTop=box.scrollHeight;
}
async function send(text){
  text=text.trim();if(!text)return;
  S.msgs.push({role:"user",text});save();drawMsgs();$("t").value="";$("t").style.height="auto";
  $("send").disabled=true;
  const box=$("msgs");box.insertAdjacentHTML("beforeend",`<div class="m a dots" id="ty">Thinking...</div>`);box.scrollTop=box.scrollHeight;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({level:S.level,subject:S.subject,mode:S.mode,messages:S.msgs})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Something went wrong.");
    S.msgs.push({role:"model",text:d.reply});save();drawMsgs();
  }catch(e){
    drawMsgs();$("msgs").insertAdjacentHTML("beforeend",`<div class="err">${esc(e.message)} Your question is saved; tap Send to try again.</div>`);
    S.msgs.pop();save();$("t").value=text;
  }
  $("send").disabled=false;
}
$("f").addEventListener("submit",e=>{e.preventDefault();send($("t").value)});
$("t").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"});
$("levels").addEventListener("click",e=>{const l=e.target.dataset.l;if(l){S.level=l;S.subject="";save();drawHeader()}});
$("modes").addEventListener("click",e=>{const m=e.target.dataset.m;if(m){S.mode=m;save();drawHeader();if(!S.msgs.length)drawMsgs()}});
$("subject").addEventListener("change",e=>{S.subject=e.target.value;save()});
$("new").addEventListener("click",()=>{S.msgs=[];save();drawMsgs()});
$("msgs").addEventListener("click",e=>{if(e.target.classList.contains("sug")){$("t").value=e.target.textContent+": ";$("t").focus()}});
drawHeader();drawMsgs();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
